<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Koch Snowflake Field - Psychedelic Flow</title>
<style>
  html,body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    /* We handle the background dynamically on the canvas now */
    background: #000;
  }
  canvas {
    display: block;
    cursor: grab;
  }
  canvas.dragging {
    cursor: grabbing;
  }
  #hud {
    position: fixed;
    left: 14px;
    bottom: 12px;
    font: 12px/1.4 ui-monospace, 'JetBrains Mono', Menlo, monospace;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: .02em;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
const API = 'http://localhost:8083/snowflake';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

// ---- base triangle geometry (as generated by the backend) ----
const M  = {x:0, y:-50};                 
const E1 = {x:200, y:0};                 
const E2 = {x:100, y:150};               

function reflect(p){ return {x:-p.x, y:-100-p.y}; }        
function tileOffset(i,j){ return {x:200*i+100*j, y:150*j}; }
function depthForZoom(z){
  let d = Math.floor(Math.log(z)/Math.log(3)) + 2;
  return Math.min(8, Math.max(1, d));
}

// ---- view state ----
const view = {x:0, y:0, zoom:1};
let cssW = innerWidth, cssH = innerHeight;

function scale(){ return view.zoom * (Math.min(cssW,cssH)/300); }
function worldToScreen(fx,fy){
  const s = scale();
  return {x: cssW/2 + (fx-view.x)*s, y: cssH/2 - (fy-view.y)*s};
}
function screenToWorld(sx,sy){
  const s = scale();
  return {x: view.x + (sx-cssW/2)/s, y: view.y - (sy-cssH/2)/s};
}

function resize(){
  const dpr = window.devicePixelRatio || 1;
  cssW = innerWidth; cssH = innerHeight;
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scheduleFetch();
}
window.addEventListener('resize', resize);

// ---- tile cache ----
const tileData = new Map();   // "i:j:type" -> world-space segments
const fetchKeys = new Set();  // "i:j:type:depth:bucketX:bucketY" dedup

function boxesIntersect(a0,a1,a2,a3,b0,b1,b2,b3){
  return !(a1<b0 || a0>b1 || a3<b2 || a2>b3);
}

function getVisibleTiles(){
  const s = scale();
  const halfW = (cssW/2)/s * 1.15;
  const halfH = (cssH/2)/s * 1.15;
  const vb = [view.x-halfW, view.x+halfW, view.y-halfH, view.y+halfH];
  const corners = [
    {x:vb[0],y:vb[2]},{x:vb[1],y:vb[2]},{x:vb[0],y:vb[3]},{x:vb[1],y:vb[3]}
  ];
  let iMin=Infinity,iMax=-Infinity,jMin=Infinity,jMax=-Infinity;
  for(const c of corners){
    const j = c.y/150;
    const i = (c.x-100*j)/200;
    if(i<iMin)iMin=i; if(i>iMax)iMax=i;
    if(j<jMin)jMin=j; if(j>jMax)jMax=j;
  }
  iMin=Math.floor(iMin)-1; iMax=Math.ceil(iMax)+1;
  jMin=Math.floor(jMin)-1; jMax=Math.ceil(jMax)+1;

  const tiles=[];
  for(let i=iMin;i<=iMax;i++){
    for(let j=jMin;j<=jMax;j++){
      const off = tileOffset(i,j);
      if(boxesIntersect(off.x-100,off.x+100,off.y-50,off.y+100, vb[0],vb[1],vb[2],vb[3]))
        tiles.push({i,j,type:'up'});
      if(boxesIntersect(off.x-100,off.x+100,off.y-200,off.y-50, vb[0],vb[1],vb[2],vb[3]))
        tiles.push({i,j,type:'down'});
    }
  }
  return tiles;
}

async function fetchTile(i,j,type,zoom){
  const off = tileOffset(i,j);
  const lc = {x:view.x-off.x, y:view.y-off.y};
  const reqC = type==='up' ? lc : reflect(lc);
  const url = `${API}?zoom=${zoom}&centerX=${reqC.x}&centerY=${reqC.y}`;
  const res = await fetch(url);
  const segs = await res.json();
  const out = new Array(segs.length);
  for(let k=0;k<segs.length;k++){
    let a = {x:segs[k].A.X, y:segs[k].A.Y};
    let b = {x:segs[k].B.X, y:segs[k].B.Y};
    if(type==='down'){ a=reflect(a); b=reflect(b); }
    out[k] = {A:{x:a.x+off.x,y:a.y+off.y}, B:{x:b.x+off.x,y:b.y+off.y}};
  }
  return out;
}

let fetchTimer=null;
function scheduleFetch(){
  clearTimeout(fetchTimer);
  fetchTimer = setTimeout(doFetch, 150);
}

async function doFetch(){
  const zoom = view.zoom;
  const depth = depthForZoom(zoom);
  const bucket = Math.max(1,(300/zoom)/2);
  const tiles = getVisibleTiles();

  const valid = new Set(tiles.map(t=>`${t.i}:${t.j}:${t.type}`));
  for(const k of [...tileData.keys()]) if(!valid.has(k)) tileData.delete(k);
  for(const k of [...fetchKeys]){
    const [ki,kj,kt] = k.split(':');
    if(!valid.has(`${ki}:${kj}:${kt}`)) fetchKeys.delete(k);
  }

  for(const t of tiles){
    const off = tileOffset(t.i,t.j);
    const lcx = view.x-off.x, lcy = view.y-off.y;
    const bcx = (Math.round(lcx/bucket)*bucket).toFixed(1);
    const bcy = (Math.round(lcy/bucket)*bucket).toFixed(1);
    const key = `${t.i}:${t.j}:${t.type}:${depth}:${bcx}:${bcy}`;
    if(fetchKeys.has(key)) continue;
    fetchKeys.add(key);
    fetchTile(t.i,t.j,t.type,zoom)
      .then(segs => tileData.set(`${t.i}:${t.j}:${t.type}`, segs))
      .catch(() => fetchKeys.delete(key));
  }
}

// ---- input ----
let dragging=false, lastX=0, lastY=0;
canvas.addEventListener('mousedown', e=>{
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  canvas.classList.add('dragging');
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  const s = scale();
  view.x -= dx/s;
  view.y += dy/s;
  scheduleFetch();
});
window.addEventListener('mouseup', ()=>{ dragging=false; canvas.classList.remove('dragging'); });
window.addEventListener('mouseleave', ()=>{ dragging=false; canvas.classList.remove('dragging'); });

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const pre = screenToWorld(e.clientX, e.clientY);
  view.zoom *= Math.pow(1.0016, -e.deltaY);
  view.zoom = Math.min(2e14, Math.max(0.05, view.zoom)); // matches server depth cap 32 (~3^30)
  const s = scale();
  view.x = pre.x - (e.clientX-cssW/2)/s;
  view.y = pre.y + (e.clientY-cssH/2)/s;
  scheduleFetch();
}, {passive:false});

// ---- render ----
const t0 = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const timeSec = (now-t0)/1000;

  // Psychedelic pulsing background
  const pulse = (Math.sin(timeSec * 1.5) + 1) / 2;
  const bgGradient = ctx.createRadialGradient(cssW/2, cssH/2, 0, cssW/2, cssH/2, Math.max(cssW, cssH));
  bgGradient.addColorStop(0, `hsl(${(timeSec * 25) % 360}, 60%, ${10 + pulse * 12}%)`);
  bgGradient.addColorStop(1, `hsl(${(timeSec * 15 + 180) % 360}, 80%, 3%)`);
  
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0,0,cssW,cssH);

  const visible = getVisibleTiles();
  const buckets = new Map();

  for(const t of visible){
    const segs = tileData.get(`${t.i}:${t.j}:${t.type}`);
    if(!segs) continue;
    for(const s of segs){
      const mx=(s.A.x+s.B.x)/2, my=(s.A.y+s.B.y)/2;
      
      // Calculate distance to origin to make colors "flow" outward
      const dist = Math.hypot(mx, my);
      
      // Compute psychedelic hue flowing with time and distance
      let hue = ((Math.atan2(my,mx)*180/Math.PI)+360)%360;
      hue = (hue - dist * 0.2 + timeSec * 120) % 360; 
      
      // Bucketing hue for optimization
      const hb = Math.round(hue/5)*5;
      
      let path = buckets.get(hb);
      if(!path){ path = new Path2D(); buckets.set(hb,path); }
      const p1 = worldToScreen(s.A.x,s.A.y), p2 = worldToScreen(s.B.x,s.B.y);
      path.moveTo(p1.x,p1.y); path.lineTo(p2.x,p2.y);
    }
  }

  // Pulsating line aesthetics
  const glowPulse = Math.sin(timeSec * 4);
  const dynamicLineWidth = 1.2 + (glowPulse * 0.4);
  const dynamicShadowBlur = 5 + (glowPulse * 3);

  ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  
  for(const [hb,path] of buckets){
    // Enhance brightness dynamically for more pop
    const lightness = 60 + Math.sin(timeSec * 5 + hb/30) * 15;
    const colorStr = `hsl(${hb}, 100%, ${lightness}%)`;
    
    ctx.lineWidth = dynamicLineWidth;
    ctx.strokeStyle = colorStr;
    ctx.shadowColor = colorStr;
    ctx.shadowBlur = dynamicShadowBlur;
    ctx.stroke(path);
  }
  
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  hud.textContent = `zoom ${view.zoom.toFixed(2)}x`;
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
